<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>筋トレログ</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#182233;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:18px 22px}header h1{margin:0;font-size:22px}header small{color:#aab5c8}.wrap{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}.tabs button.active{background:#2563eb;color:white}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#e5eaf2;color:#172033}button.primary{background:#2563eb;color:#fff}button.danger{background:#fee2e2;color:#991b1b}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #152a4910}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px}label{font-size:13px;color:#475569}input,select{width:100%;border:1px solid #d6deeb;border-radius:9px;padding:10px;background:white;color:#182233}input[type=checkbox]{width:auto}.muted{color:#64748b;font-size:13px}.setrow{display:grid;grid-template-columns:50px 1fr 1fr auto;gap:8px;align-items:center;margin:8px 0}.setrow input{min-width:0}.exercise{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:12px}.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stat{font-size:28px;font-weight:750}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;padding:10px 3px;border-radius:8px;background:#f1f5f9;min-height:40px}.day.done{background:#bfdbfe;color:#1d4ed8;font-weight:700}.day.today{outline:2px solid #2563eb}.day.selected{background:#2563eb;color:white}.hidden{display:none!important}canvas{width:100%;height:260px}table{width:10 </style></head><body><header><div style="max-width:1100px;margin:auto"><h1>筋トレログ</h1><small>自分だけのトレーニング記録</small></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><section id="home"></section><section id="record" class="hidden"></section><section id="history" class="hidden"></section><section id="charts" class="hidden"></section><section id="timer" class="hidden"></section><section id="settings" class="hidden"></section></main><footer>記録はこのブラウザ内に保存されます。定期的にバックアップしてください。</footer><script>
'use strict';const KEY='workoutmemo_v1';const defaults=['ベンチプレス','スクワット','デッドリフト','ショルダープレス','ラットプルダウン','懸垂','ダンベルカール','レッグプレス','サイドレイズ','プランク'];const parts=['胸','背中','脚','肩','腕','腹','全身','その他'];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.sessions))data={sessions:[],exercises:defaults.map((name,i)=>({id:'d'+i,name,part:['胸','脚','背中','肩','背中','背中','腕','脚','肩','腹'][i]})),templates:[]};data.exercises ||= [];data.templates ||= [];let editing=null,working=[],active='home',month=new Date(),selectedDay=null;const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),today=()=>new Date().toLocaleDateString('sv-SE'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存できませんでした。ストレージ容量を確認してください。')}};const byId=id=>data.exercises.find(e=>e.id===id),fmtDate=d=>d.replaceAll('-','/');const tabs=[['home','ホーム'],['record','記録'],['history','履歴'],['charts','分析'],['timer','タイマー'],['settings','設定']];function navigate(id){active=id;tabs.forEach(([k])=>$(k).classList.toggle('hidden',k!==id));$('tabs').innerHTML=tabs.map(([k,v])=>`<button class="${id===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));render();}function render(){({home:renderHome,record:renderRecord,history:renderHistory,charts:renderCharts,timer:renderTimer,settings:renderSettings})[active]();}const vol=s=>s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(+x.weight||0)*(+x.reps||0),0),0);const best=id=>data.sessions.flatMap(s=>s.exercises.filter(e=>e.id===id).flatMap(e=>e.sets.map(x=>({...x,date:s.date})))).sort((a,b)=>(+b.weight||0)-(+a.weight||0))[0];function renderHome(){let sessions=data.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date));let thisMonth=today().slice(0,7);$('home').innerHTML=`<div class="grid"><div class="card"><div class="muted">総トレーニング回数</div><div class="stat">${sessions.length}</div></div><div class="card"><div class="muted">今月の実施日数</div><div class="stat">${new Set(sessions.filter(s=>s.date.startsWith(thisMonth)).map(s=>s.date)).size}</div></div><div class="card"><div class="muted">総負荷量</div><div class="stat">${Math.round(sessions.reduce((a,s)=>a+vol(s),0)).toLocaleString()} <small>kg</small></div></div></div><div class="card"><h2>最近のトレーニング</h2>${sessions.slice(0,5).map(s=>`<p><button data-open="${s.id}">${fmtDate(s.date)} — ${s.exercises.map(e=>esc(byId(e.id)?.name||'削除済み種目')).join('、')}</button></p>`).join('')||'<p class="muted">まだ記録がありません。</p>'}<button class="primary" id="newNow">今日の筋トレを記録</button></div>`;$('newNow').onclick=()=>{startNew();navigate('record')};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{editing=b.dataset.open;navigate('record')});}
function startNew(){editing=null;working=[]}function currentSession(){return data.sessions.find(s=>s.id===editing)}function renderRecord(){let s=currentSession(),date=s?.date||today(),note=s?.note||'';$('record').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>${editing?'トレーニングを編集':'トレーニングを記録'}</h2><button id="fresh">新規作成</button></div><div class="grid"><div class="field"><label>日付</label><input type="date" id="workdate" value="${date}"></div><div class="field"><label>メモ</label><input id="worknote" value="${esc(note)}" placeholder="調子・フォームなど"></div></div><div class="row" style="margin-top:12px"><div class="field"><label>① 部位を選択</label><select id="partPick"><option value="">部位を選択してください</option>${parts.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></div><div class="field"><label>② 種目を選択</label><select id="exercisePick" disabled><option value="">先に部位を選択してください</option></select></div><button class="primary" id="addExercise">追加</button></div><div class="row" style="margin-top:10px"><div class="field"><label>テンプレートを読み込む</label><select id="templatePick"><option value="">選択してください</option>${data.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button id="loadTemplate">読込</button></div><div id="exerciseRows"></div><div class="row" style="margin-top:16px"><button class="primary" id="saveSession">記録を保存</button><button id="saveTemplate">メニューをテンプレート保存</button>${editing?'<button class="danger" id="deleteSession">この記録を削除</button>':''}</div></div>`;if(s&&!working.length)working=structuredClone(s.exercises);renderExerciseRows();$('partPick').onchange=()=>{let part=$('partPick').value,pick=$('exercisePick');pick.disabled=!part;pick.innerHTML='<option value="">種目を選択してください</option>'+data.exercises.filter(e=>e.part===part).map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')};$('fresh').onclick=()=>{startNew();renderRecord()};$('addExercise').onclick=()=>{let id=$('exercisePick').value;if(!id)return;working.push({id,sets:[{weight:0,reps:10}]});renderExerciseRows()};$('loadTemplate').onclick=()=>{let t=data.templates.find(x=>x.id===$('templatePick').value);if(t&&confirm('現在の種目をテンプレートで置き換えますか？')){working=structuredClone(t.exercises);renderExerciseRows()}};$('saveSession').onclick=()=>{syncRows();if(!working.length)return alert('種目を1つ以上追加してください');let d=$('workdate').value;if(!d)return alert('日付を入力してください');let obj={id:editing||uid(),date:d,note:$('worknote').value,exercises:structuredClone(working)};if(editing){let i=data.sessions.findIndex(x=>x.id===editing);if(i>=0)data.sessions[i]=obj;else data.sessions.push(obj)}else data.sessions.push(obj);save();startNew();navigate('history');alert('記録を保存しました')};$('saveTemplate').onclick=()=>{syncRows();if(!working.length)return alert('種目を追加してください');let name=prompt('テンプレート名');if(name?.trim()){data.templates.push({id:uid(),name:name.trim(),exercises:structuredClone(working)});save();renderRecord()}};if(editing)$('deleteSession').onclick=()=>{if(confirm('この記録を削除しますか？')){data.sessions=data.sessions.filter(x=>x.id!==editing);save();startNew();navigate('history')}};}
function syncRows(){document.querySelectorAll('.exercise').forEach(box=>{let i=+box.dataset.i;if(!working[i])return;working[i].sets=[...box.querySelectorAll('.setrow')].map(r=>({weight:Math.max(0,+r.querySelector('.weight').value||0),reps:Math.max(0,Math.floor(+r.querySelector('.reps').value||0))}))})}function renderExerciseRows(){let container=$('exerciseRows');container.innerHTML=working.map((e,i)=>{let prev=best(e.id);return `<div class="exercise" data-i="${i}"><div class="exercise-head"><strong>${esc(byId(e.id)?.name||'削除済み種目')}</strong><div><button data-duplicate="${i}">前セット複製</button> <button class="danger" data-remove="${i}">削除</button></div></div><p class="muted">${prev?`過去の最高重量：${prev.weight} kg × ${prev.reps} 回`:'過去の記録なし'}</p><div class="muted">セット　重量 (kg)　　　　回数</div>${e.sets.map((x,j)=>`<div class="setrow"><span>${j+1}</span><input class="weight keypad-input" type="text" inputmode="none" readonly value="${+x.weight||0}" aria-label="重量"><input class="reps keypad-input" type="text" inputmode="none" readonly value="${+x.reps||0}" aria-label="回数"><button data-delset="${i}:${j}" aria-label="セット削除">×</button></div>`).join('')}<button data-addset="${i}">＋ セット追加</button></div>`}).join('');container.querySelectorAll('.keypad-input').forEach(input=>input.onclick=()=>openKeypad(input));container.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{syncRows();working.splice(+b.dataset.remove,1);renderExerciseRows()});container.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{syncRows();let e=working[+b.dataset.addset];e.sets.push({...e.sets.at(-1)||{weight:0,reps:10}});renderExerciseRows()});container.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>{syncRows();let e=working[+b.dataset.duplicate];e.sets.push({...e.sets.at(-1)||{weight:0,reps:10}});renderExerciseRows()});container.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{syncRows();let [i,j]=b.dataset.delset.split(':').map(Number);working[i].sets.splice(j,1);renderExerciseRows()})}
let keypadTarget=null,keypadValue='';function openKeypad(input){keypadTarget=input;keypadValue=String(input.value||'0');let isWeight=input.classList.contains('weight');let overlay=document.createElement('div');overlay.id='numOverlay';overlay.className='num-overlay';overlay.innerHTML=`<div class="num-panel" role="dialog" aria-modal="true" aria-label="数値入力"><div class="num-header"><strong>${isWeight?'重量 (kg)':'回数'}</strong><button type="button" id="numCancel">閉じる</button></div><div class="num-display" id="numDisplay">${esc(keypadValue)}</div><div class="num-grid">${['7','8','9','4','5','6','1','2','3',isWeight?'.':'C','0','⌫','C','OK'].map(k=>`<button type="button" data-key="${k}" class="${k==='OK'?'primary':''}" ${!isWeight&&k==='C'?'':''}>${k}</button>`).join('')}</div></div>`;document.body.appendChild(overlay);const display=()=>{$('numDisplay').textContent=keypadValue||'0'};overlay.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='OK'){let n=Number(keypadValue);keypadTarget.value=String(Number.isFinite(n)?Math.max(0,isWeight?n:Math.floor(n)):0);overlay.remove();keypadTarget=null;return}if(k==='C')keypadValue='';else if(k==='⌫')keypadValue=keypadValue.slice(0,-1);else if(k==='.') {if(!keypadValue.includes('.'))keypadValue=(keypadValue||'0')+'.'}else if(keypadValue.replace('.','').length<8)keypadValue=keypadValue==='0'?k:keypadValue+k;display()});$('numCancel').onclick=()=>{overlay.remove();keypadTarget=null};overlay.onclick=e=>{if(e.target===overlay){overlay.remove();keypadTarget=null}}}
function renderHistory(){let y=month.getFullYear(),m=month.getMonth(),days=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7,dates=new Set(data.sessions.map(s=>s.date));let cells=['月','火','水','木','金','土','日'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')+Array(offset).fill('<div></div>').join('');for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${dates.has(date)?'done':''} ${date===today()?'today':''} ${selectedDay===date?'selected':''}" data-date="${date}">${d}</button>`}let list=data.sessions.filter(s=>!selectedDay||s.date===selectedDay).sort((a,b)=>b.date.localeCompare(a.date));$('history').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><button id="prevMonth">←</button><h2>${y}年${m+1}月</h2><button id="nextMonth">→</button></div><div class="calendar">${cells}</div><p class="muted">青い日付はトレーニング実施日。日付を押すと絞り込みます。</p><button id="clearDay">全記録を表示</button></div><div class="card"><h2>トレーニング履歴 ${selectedDay?`(${fmtDate(selectedDay)})`:''}</h2>${list.map(s=>`<div class="exercise"><div class="row" style="justify-content:space-between"><strong>${fmtDate(s.date)}</strong><button data-edit="${s.id}">編集</button></div><p class="muted">${esc(s.note)}</p>${s.exercises.map(e=>`<p><b>${esc(byId(e.id)?.name||'削除済み種目')}</b>：${e.sets.map(x=>`${x.weight}kg × ${x.reps}回`).join(' / ')}</p>`).join('')}<div class="muted">総負荷量：${vol(s).toLocaleString()} kg</div></div>`).join('')||'<p class="muted">記録がありません。</p>'}</div>`;$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderHistory()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderHistory()};$('clearDay').onclick=()=>{selectedDay=null;renderHistory()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.date;renderHistory()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;working=[];navigate('record')})}
function renderCharts(){$('charts').innerHTML=`<div class="card"><h2>成長グラフ</h2><div class="grid"><div class="field"><label>種目</label><select id="chartExercise">${data.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>指標</label><select id="chartMetric"><option value="max">最高重量 (kg)</option><option value="volume">総負荷量 (kg)</option><option value="rm">推定1RM (kg)</option></select></div></div><canvas id="chart" aria-label="成長グラフ"></canvas><p id="chartSummary" class="muted"></p></div><div class="card"><h2>推定1RM計算</h2><p class="muted">Epley式：重量 × (1 + 回数 ÷ 30)。推定値であり実測値ではありません。</p><div class="grid"><div class="field"><label>重量 (kg)</label><input id="rmWeight" type="number" min="0" value="60"></div><div class="field"><label>回数</label><input id="rmReps" type="number" min="1" value="8"></div></div><p class="stat" id="rmResult"></p></div>`;let c=$('chartExercise'),metric=$('chartMetric');c.onchange=drawChart;metric.onchange=drawChart;$('rmWeight').oninput=calcRm;$('rmReps').oninput=calcRm;calcRm();drawChart()}function calcRm(){let w=+$('rmWeight').value,r=+$('rmReps').value;$('rmResult').textContent=w>0&&r>0?(r===1?w:w*(1+r/30)).toFixed(1)+' kg':'—'}function drawChart(){let id=$('chartExercise').value,metric=$('chartMetric').value;let pts=data.sessions.filter(s=>s.exercises.some(e=>e.id===id)).map(s=>{let sets=s.exercises.filter(e=>e.id===id).flatMap(e=>e.sets);return {date:s.date,value:metric==='volume'?sets.reduce((a,x)=>a+x.weight*x.reps,0):Math.max(0,...sets.map(x=>metric==='rm'?x.weight*(1+x.reps/30):x.weight))}}).sort((a,b)=>a.date.localeCompare(b.date));let canvas=$('chart'),rect=canvas.getBoundingClientRect(),w=Math.max(280,rect.width),h=260,ratio=devicePixelRatio||1;canvas.width=w*ratio;canvas.height=h*ratio;let ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);let pad={l:55,r:15,t:20,b:45},max=Math.max(1,...pts.map(p=>p.value))*1.12;ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#64748b';ctx.font='12px system-ui';for(let i=0;i<=4;i++){let y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)).toString(),5,y+4)}if(!pts.length){$('chartSummary').textContent='この種目の記録はまだありません。';return}ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{let x=pad.l+(w-pad.l-pad.r)*(pts.length===1?.5:i/(pts.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-p.value/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#2563eb';pts.forEach((p,i)=>{let x=pad.l+(w-pad.l-pad.r)*(pts.length===1?.5:i/(pts.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-p.value/max);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#64748b';ctx.fillText(pts[0].date.slice(5),pad.l,h-15);if(pts.length>1)ctx.fillText(pts.at(-1).date.slice(5),w-65,h-15);$('chartSummary').textContent=`${pts.length}件の記録・最新 ${pts.at(-1).value.toFixed(1)} kg・最高 ${Math.max(...pts.map(p=>p.value)).toFixed(1)} kg`}
let remaining=90,timerInterval=null,timerRunning=false;function renderTimer(){$('timer').innerHTML=`<div class="card"><h2>インターバルタイマー</h2><div class="row"><button data-sec="60">60秒</button><button data-sec="90">90秒</button><button data-sec="120">120秒</button><button data-sec="180">180秒</button></div><p class="timer" id="clock"></p><div class="row"><button class="primary" id="timerStart">${timerRunning?'一時停止':'開始'}</button><button id="timerReset">リセット</button></div><p class="muted">画面を開いたまま使用してください。バックグラウンドでは通知を保証しません。</p></div>`;document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{pauseTimer();remaining=+b.dataset.sec;updateClock();$('timerStart').textContent='開始'});$('timerStart').onclick=()=>{if(timerRunning){pauseTimer()}else{timerRunning=true;let target=Date.now()+remaining*1000;timerInterval=setInterval(()=>{remaining=Math.max(0,Math.ceil((target-Date.now())/1000));updateClock();if(remaining<=0){pauseTimer();alert('休憩終了です')}},200)}$('timerStart').textContent=timerRunning?'一時停止':'開始'};$('timerReset').onclick=()=>{pauseTimer();remaining=90;updateClock();$('timerStart').textContent='開始'};updateClock()}function updateClock(){if($('clock'))$('clock').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}function pauseTimer(){clearInterval(timerInterval);timerRunning=false}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>種目管理</h2><div class="row"><div class="field"><label>新しい種目名</label><input id="newName" placeholder="例：インクラインベンチ"></div><div class="field"><label>部位</label><select id="newPart">${parts.map(p=>`<option>${p}</option>`).join('')}</select></div><button class="primary" id="addCustom">追加</button></div><div id="exerciseList"></div></div><div class="card"><h2>テンプレート管理</h2><div id="templateList"></div></div><div class="card"><h2>データ管理</h2><p class="muted">データはこの端末・ブラウザのlocalStorageに保存されます。別の端末とは自動同期されません。</p><div class="row"><button class="primary" id="exportData">JSONバックアップを保存</button><label style="background:#e5eaf2;padding:10px;border-radius:10px;cursor:pointer">JSONを読み込む<input type="file" id="importData" accept=".json,application/json" style="display:none"></label><button class="danger" id="clearData">全データ削除</button></div></div>`;function lists(){$('exerciseList').innerHTML=data.exercises.map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:8px 0"><span>${esc(e.part)}｜${esc(e.name)}</span><button data-deleteex="${e.id}" class="danger">削除</button></div>`).join('');$('templateList').innerHTML=data.templates.map(t=>`<div class="row" style="justify-content:space-between;padding:8px"><span>${esc(t.name)}</span><button class="danger" data-deletet="${t.id}">削除</button></div>`).join('')||'<p class="muted">テンプレートはありません。</p>';document.querySelectorAll('[data-deleteex]').forEach(b=>b.onclick=()=>{if(confirm('種目を一覧から削除しますか？（過去の記録は残ります）')){data.exercises=data.exercises.filter(e=>e.id!==b.dataset.deleteex);save();lists()}});document.querySelectorAll('[data-deletet]').forEach(b=>b.onclick=()=>{data.templates=data.templates.filter(t=>t.id!==b.dataset.deletet);save();lists()})}lists();$('addCustom').onclick=()=>{let name=$('newName').value.trim();if(!name)return;data.exercises.push({id:uid(),name,part:$('newPart').value});save();$('newName').value='';lists()};$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`筋トレログ_backup_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importData').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.sessions)||!Array.isArray(obj.exercises)||!Array.isArray(obj.templates))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data=obj;save();startNew();renderSettings();alert('読み込みました')}catch(err){alert('読み込み失敗：'+err.message)}};$('clearData').onclick=()=>{if(confirm('全記録・種目・テンプレートを削除します。元に戻せません。続けますか？')){localStorage.removeItem(KEY);location.reload()}}}
navigate('home');</script></body></html>
