'fresh').onclick=()=>{startNew();renderRecord()};$('addExercise').onclick=()=>{let id=$('exercisePick').value;if(!id)return;working.push({id,sets:[{weight:0,reps:10}]});renderExerciseRows()};$('loadTemplate').onclick=()=>{let t=data.templates.find(x=>x.id===$('templatePick').value);if(t&&confirm('現在の種目をテンプレートで置き換えますか？')){working=structuredClone(t.exercises);renderExerciseRows()}};$('saveSession').onclick=()=>{syncRows();if(!working.length)return alert('種目を1つ以上追加してください');let d=$('workdate').value;if(!d)return alert('Dateを入力してください');let obj={id:editing||uid(),date:d,note:$('worknote').value,exercises:structuredClone(working)};if(editing){let i=data.sessions.findIndex(x=>x.id===editing);if(i>=0)data.sessions[i]=obj;else data.sessions.push(obj)}else data.sessions.push(obj);save();startNew();navigate('history');alert('Save Workoutしました')};$('saveTemplate').onclick=()=>{syncRows();if(!working.length)return alert('種目を追加してください');let name=prompt('テンプレート名');if(name?.trim()){data.templates.push({id:uid(),name:name.trim(),exercises:structuredClone(working)});save();renderRecord()}};if(editing)$('deleteSession').onclick=()=>{if(confirm('Delete Workoutしますか？')){data.sessions=data.sessions.filter(x=>x.id!==editing);save();startNew();navigate('history')}};}
function syncRows(){document.querySelectorAll('.exercise').forEach(box=>{let i=+box.dataset.i;if(!working[i])return;working[i].sets=[...box.querySelectorAll('.setrow')].map(r=>({weight:Math.max(0,+r.querySelector('.weight').value||0),reps:Math.max(0,Math.floor(+r.querySelector('.reps').value||0))}))})}function renderExerciseRows(){let container=$('exerciseRows');container.innerHTML=working.map((e,i)=>{let prev=best(e.id);return `<div class="exercise" data-i="${i}"><div class="exercise-head"><strong>${esc(byId(e.id)?.name||'削除済み種目')}</strong><div><button data-duplicate="${i}">Duplicate Set</button> <button class="danger" data-remove="${i}">削除</button></div></div><p class="muted">${prev?`Previous best：${prev.weight} kg × ${prev.reps} 回`:'No previous record'}</p><div class="muted">SET　　 WEIGHT (kg)　　　 REPS</div>${e.sets.map((x,j)=>`<div class="setrow"><span>${j+1}</span><input class="weight keypad-input" type="text" inputmode="none" readonly value="${+x.weight||0}" aria-label="重量"><input class="reps keypad-input" type="text" inputmode="none" readonly value="${+x.reps||0}" aria-label="回数"><button data-delset="${i}:${j}" aria-label="セット削除">×</button></div>`).join('')}<button data-addset="${i}">＋ Add Set</button></div>`}).join('');container.querySelectorAll('.keypad-input').forEach(input=>input.onclick=()=>openKeypad(input));container.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{syncRows();working.splice(+b.dataset.remove,1);renderExerciseRows()});container.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{syncRows();let e=working[+b.dataset.addset];e.sets.push({...e.sets.at(-1)||{weight:0,reps:10}});renderExerciseRows()});container.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>{syncRows();let e=working[+b.dataset.duplicate];e.sets.push({...e.sets.at(-1)||{weight:0,reps:10}});renderExerciseRows()});container.querySelectorAll('[data-delset]').forEach(b=>b.onclick=()=>{syncRows();let [i,j]=b.dataset.delset.split(':').map(Number);work let keypadTarget=null,keypadValue='';function openKeypad(input){keypadTarget=input;keypadValue=String(input.value||'0');let isWeight=input.classList.contains('weight');let overlay=document.createElement('div');overlay.id='numOverlay';overlay.className='num-overlay';overlay.innerHTML=`<div class="num-panel" role="dialog" aria-modal="true" aria-label="数値入力"><div class="num-header"><strong>${isWeight?'Weight (kg)':'回数'}</strong><button type="button" id="numCancel">Close</button></div><div class="num-display" id="numDisplay">${esc(keypadValue)}</div><div class="num-grid">${['7','8','9','4','5','6','1','2','3',isWeight?'.':'C','0','⌫','C','OK'].map(k=>`<button type="button" data-key="${k}" class="${k==='OK'?'primary':''}" ${!isWeight&&k==='C'?'':''}>${k}</button>`).join('')}</div></div>`;document.body.appendChild(overlay);const display=()=>{$('numDisplay').textContent=keypadValue||'0'};overlay.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='OK'){let n=Number(keypadValue);keypadTarget.value=String(Number.isFinite(n)?Math.max(0,isWeight?n:Math.floor(n)):0);overlay.remove();keypadTarget=null;return}if(k==='C')keypadValue='';else if(k==='⌫')keypadValue=keypadValue.slice(0,-1);else if(k==='.') {if(!keypadValue.includes('.'))keypadValue=(keypadValue||'0')+'.'}else if(keypadValue.replace('.','').length<8)keypadValue=keypadValue==='0'?k:keypadValue+k;display()});$('numCancel').onclick=()=>{overlay.remove();keypadTarget=null};overlay.onclick=e=>{if(e.target===overlay){overlay.remove();keypadTarget=null}}}
function renderHistory(){let y=month.getFullYear(),m=month.getMonth(),days=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7,dates=new Set(data.sessions.map(s=>s.date));let cells=['月','火','水','木','金','土','日'].map(x=>`<div class="muted" style="text-align:center">${x}</div>`).join('')+Array(offset).fill('<div></div>').join('');for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells+=`<button class="day ${dates.has(date)?'done':''} ${date===today()?'today':''} ${selectedDay===date?'selected':''}" data-date="${date}">${d}</button>`}let list=data.sessions.filter(s=>!selectedDay||s.date===selectedDay).sort((a,b)=>b.date.localeCompare(a.date));$('history').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><button id="prevMonth">←</button><h2>${y}年${m+1}月</h2><button id="nextMonth">→</button></div><div class="calendar">${cells}</div><p class="muted">青いDateはトレーニング実施日。Dateを押すと絞り込みます。</p><button id="clearDay">Show All</button></div><div class="card"><h2>Workout History ${selectedDay?`(${fmtDate(selectedDay)})`:''}</h2>${list.map(s=>`<div class="exercise"><div class="row" style="justify-content:space-between"><strong>${fmtDate(s.date)}</strong><button data-edit="${s.id}">編集</button></div><p class="muted">${esc(s.note)}</p>${s.exercises.map(e=>`<p><b>${esc(byId(e.id)?.name||'削除済み種目')}</b>：${e.sets.map(x=>`${x.weight}kg × ${x.reps}回`).join(' / ')}</p>`).join('')}<div class="muted">総負荷量：${vol(s).toLocaleString()} kg</div></div>`).join('')||'<p class="muted">No workouts found.</p>'}</div>`;$('prevMonth').onclick=()=>{month.setMonth(month.getMonth()-1);renderHistory()};$('nextMonth').onclick=()=>{month.setMonth(month.getMonth()+1);renderHistory()};$('clearDay').onclick=()=>{selectedDay=null;renderHistory()};document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.date;renderHistory()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;working=[];navigate('record')})}
function renderCharts(){$('charts').innerHTML=`<div class="card"><h2>Progress Chart</h2><div class="grid"><div class="field"><label>Exercise</label><select id="chartExercise">${data.exercises.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Metric</label><select id="chartMetric"><option value="max">最高Weight (kg)</option><option value="volume">Total Volume (kg)</option><option value="rm">Estimated 1RM (kg)</option></select></div></div><canvas id="chart" aria-label="Progress Chart"></canvas><p id="chartSummary" class="muted"></p></div><div class="card"><h2>1RM Calculator</h2><p class="muted">Epley式：重量 × (1 + 回数 ÷ 30)。推定値であり実測値ではありません。</p><div class="grid"><div class="field"><label>Weight (kg)</label><input id="rmWeight" type="number" min="0" value="60"></div><div class="field"><label>Reps</label><input id="rmReps" type="number" min="1" value="8"></div></div><p class="stat" id="rmResult"></p></div>`;let c=$('chartExercise'),metric=$('chartMetric');c.onchange=drawChart;metric.onchange=drawChart;$('rmWeight').oninput=calcRm;$('rmReps').oninput=calcRm;calcRm();drawChart()}function calcRm(){let w=+$('rmWeight').value,r=+$('rmReps').value;$('rmResult').textContent=w>0&&r>0?(r===1?w:w*(1+r/30)).toFixed(1)+' kg':'—'}function drawChart(){let id=$('chartExercise').value,metric=$('chartMetric').value;let pts=data.sessions.filter(s=>s.exercises.some(e=>e.id===id)).map(s=>{let sets=s.exercises.filter(e=>e.id===id).flatMap(e=>e.sets);return {date:s.date,value:metric==='volume'?sets.reduce((a,x)=>a+x.weight*x.reps,0):Math.max(0,...sets.map(x=>metric==='rm'?x.weight*(1+x.reps/30):x.weight))}}).sort((a,b)=>a.date.localeCompare(b.date));let canvas=$('chart'),rect=canvas.getBoundingClientRect(),w=Math.max(280,rect.width),h=260,ratio=devicePixelRatio||1;canvas.width=w*ratio;canvas.height=h*ratio;let ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);let pad={l:55,r:15,t:20,b:45},max=Math.max(1,...pts.map(p=>p.value))*1.12;ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#64748b';ctx.font='12px system-ui';for(let i=0;i<=4;i++){let y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)).toString(),5,y+4)}if(!pts.length){$('chartSummary').textContent='この種目の記録はまだありません。';return}ctx.strokeStyle='#34d399';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{let x=pad.l+(w-pad.l-pad.r)*(pts.length===1?.5:i/(pts.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-p.value/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#34d399';pts.forEach((p,i)=>{let x=pad.l+(w-pad.l-pad.r)*(pts.length===1?.5:i/(pts.length-1)),y=pad.t+(h-pad.t-pad.b)*(1-p.value/max);ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#64748b';ctx.fillText(pts[0].date.slice(5),pad.l,h-15);if(pts.length>1)ctx.fillText(pts.at(-1).date.slice(5),w-65,h-15);$('chartSummary').textContent=`${pts.length}件の記録・最新 ${pts.at(-1).value.toFixed(1)} kg・最高 ${Math.max(...pts.map(p=>p.value)).toFixed(1)} kg`}
let remaining=90,timerInterval=null,timerRunning=false;function renderTimer(){$('timer').innerHTML=`<div class="card"><h2>Rest Timer</h2><div class="row"><button data-sec="60">60秒</button><button data-sec="90">90秒</button><button data-sec="120">120秒</button><button data-sec="180">180秒</button></div><p class="timer" id="clock"></p><div class="row"><button class="primary" id="timerStart">${timerRunning?'Pause':'Start'}</button><button id="timerReset">Reset</button></div><p class="muted">画面を開いたまま使用してください。バックグラウンドでは通知を保証しません。</p></div>`;document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{pauseTimer();remaining=+b.dataset.sec;updateClock();$('timerStart').textContent='Start'});$('timerStart').onclick=()=>{if(timerRunning){pauseTimer()}else{timerRunning=true;let target=Date.now()+remaining*1000;timerInterval=setInterval(()=>{remaining=Math.max(0,Math.ceil((target-Date.now())/1000));updateClock();if(remaining<=0){pauseTimer();alert('休憩終了です')}},200)}$('timerStart').textContent=timerRunning?'Pause':'Start'};$('timerReset').onclick=()=>{pauseTimer();remaining=90;updateClock();$('timerStart').textContent='Start'};updateClock()}function updateClock(){if($('clock'))$('clock').textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`}function pauseTimer(){clearInterval(timerInterval);timerRunning=false}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Exercise Library</h2><div class="row"><div class="field"><label>New exercise name</label><input id="newName" placeholder="例：インクラインベンチ"></div><div class="field"><label>Muscle Group</label><select id="newPart">${parts.map(p=>`<option>${p}</option>`).join('')}</select></div><button class="primary" id="addCustom">追加</button></div><div id="exerciseList"></div></div><div class="card"><h2>Templates</h2><div id="templateList"></div></div><div class="card"><h2>Data & Backup</h2><p class="muted">データはこの端末・ブラウザのlocalStorageに保存されます。別の端末とは自動同期されません。</p><div class="row"><button class="primary" id="exportData">Export JSON Backup</button><label style="background:#e5eaf2;padding:10px;border-radius:10px;cursor:pointer">Import JSON<input type="file" id="importData" accept=".json,application/json" style="display:none"></label><button class="danger" id="clearData">Delete All Data</button></div></div>`;function lists(){$('exerciseList').innerHTML=data.exercises.map(e=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:8px 0"><span>${esc(e.part)}｜${esc(e.name)}</span><button data-deleteex="${e.id}" class="danger">削除</button></div>`).join('');$('templateList').innerHTML=data.templates.map(t=>`<div class="row" style="justify-content:space-between;padding:8px"><span>${esc(t.name)}</span><button class="danger" data-deletet="${t.id}">削除</button></div>`).join('')||'<p class="muted">テンプレートはありません。</p>';document.querySelectorAll('[data-deleteex]').forEach(b=>b.onclick=()=>{if(confirm('種目を一覧から削除しますか？（過去の記録は残ります）')){data.exercises=data.exercises.filter(e=>e.id!==b.dataset.deleteex);save();lists()}});document.querySelectorAll('[data-deletet]').forEach(b=>b.onclick=()=>{data.templates=data.templates.filter(t=>t.id!==b.dataset.deletet);save();lists()})}lists();$('addCustom').onclick=()=>{let name=$('newName').value.trim();if(!name)return;data.exercises.push({id:uid(),name,part:$('newPart').value});save();$('newName').value='';lists()};$('exportData').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`筋トレログ_backup_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importData').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.sessions)||!Array.isArray(obj.exercises)||!Array.isArray(obj.templates))throw Error('形式が違います');if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data=obj;save();startNew();renderSettings();alert('読み込みました')}catch(err){alert('読み込み失敗：'+err.message)}};$('clearData').onclick=()=>{if(confirm('全記録・種目・テンプレートを削除します。元に戻せません。続けますか？')){localStorage.removeItem(KEY);location.reload()}}}
navigate('home');</script></body></html>
